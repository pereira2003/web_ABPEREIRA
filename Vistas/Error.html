<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin conexión | A⁺Pereira Company</title>
    <link rel="icon" type="image/x-icon" href="../img/ABP.ico?v=2">
    <link rel="shortcut icon" href="../img/ABP.ico?v=2" type="image/x-icon">
    <link rel="apple-touch-icon" href="../img/ABPEREIRA%20L.png?v=2">
    <link rel="manifest" href="../manifest.json?v=2">
    <meta name="theme-color" content="#0c3363">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Cormorant+Garamond:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0c3363;
            --accent: #be945d;
            --text: #1a1a1a;
            --bg: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            text-align: center;
            color: var(--text);
        }

        .container {
            padding: 2rem;
            max-width: 800px;
            width: 90%;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.2rem, 7vw, 3.5rem);
            color: var(--primary);
            margin: 0;
        }

        p {
            font-size: 1.05rem;
            color: #555;
            margin: 0.3rem 0 1.5rem;
            font-weight: 300;
        }

        .scene {
            position: relative;
            height: 300px;
            width: 100%;
            margin-bottom: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .maintenance-illustration {
            width: 320px;
            height: 260px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow: hidden;
        }

        .tech-img {
            width: 300px;
            height: auto;
            z-index: 2;
            mix-blend-mode: darken;
            filter: contrast(1.2) brightness(1.1);
            margin-top: -10px; 
        }

        .glow-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 260px;
            height: 260px;
            background: radial-gradient(circle, rgba(190, 148, 93, 0.15) 0%, rgba(255,255,255,0) 70%);
            z-index: 1;
        }

        .btn-retry {
            margin-top: 0;
            padding: 0.9rem 2.2rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-retry:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(12, 51, 99, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="scene">
            <div class="glow-circle"></div>
            <div class="maintenance-illustration">
                <img src="../img/icono de mantenimiento.jpg" alt="Technician" class="tech-img">
            </div>
        </div>
        
        <h1 id="errorTitle">No tienes conexión</h1>
        <p id="errorMsg">Revisa tu conexión a internet para continuar usando A⁺Pereira.</p>

        <button onclick="window.location.reload()" class="btn-retry">Intentar de nuevo</button>
    </div>

    <script>
        window.addEventListener('online', () => {
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
